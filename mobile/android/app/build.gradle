plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}
def flutterVersionCode = localProperties.getProperty("flutter.versionCode", "1")
def flutterVersionName = localProperties.getProperty("flutter.versionName", "1.0")
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}
def requiredSigningProperties = ["keyAlias", "keyPassword", "storeFile", "storePassword"]
def releaseSigningReady = keystorePropertiesFile.exists() &&
        requiredSigningProperties.every { keystoreProperties.getProperty(it)?.trim() } &&
        file(keystoreProperties.getProperty("storeFile", "")).isFile()

android {
    namespace = "com.saicollege.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    defaultConfig {
        applicationId = "com.saicollege.mobile"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
                storeFile = file(keystoreProperties.getProperty("storeFile"))
                storePassword = keystoreProperties.getProperty("storePassword")
            }
        }
    }
    buildTypes {
        release {
            // Never silently sign production output with the debug key.
            signingConfig = releaseSigningReady ? signingConfigs.release : null
        }
    }
}
flutter { source = "../.." }

gradle.taskGraph.whenReady { taskGraph ->
    def buildsReleaseArtifact = taskGraph.allTasks.any {
        it.name == "assembleRelease" || it.name == "bundleRelease"
    }
    if (buildsReleaseArtifact && !releaseSigningReady) {
        throw new GradleException("Release APK/AAB builds require a complete key.properties and existing keystore.")
    }
}
