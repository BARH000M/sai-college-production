name: sai_college_mobile
publish_to: none
description: Yemen SAI Educational College - modular Flutter UI
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
