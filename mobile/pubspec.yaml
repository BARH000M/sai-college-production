name: sai_approved_mobile
description: SAI College approved Arabic mobile interface.
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.3
  pdf: ^3.11.3
  printing: ^5.14.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/NotoSansSC.otf
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: NotoSC
      fonts:
        - asset: assets/fonts/NotoSansSC.otf
