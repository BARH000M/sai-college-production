name: sai_school
description: تطبيق المدرسة — Supabase auth, role router, Arabic RTL.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: 2.5.4
  shared_preferences: 2.2.3

# Existing repair from copilot/fix-build-debug-apk-again: app_links 6.4.1
# references the Flutter extension while being evaluated as a library module.
dependency_overrides:
  app_links: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
