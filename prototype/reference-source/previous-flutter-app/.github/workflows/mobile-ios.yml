name: Mobile iOS verification

on:
  push:
    branches: ['**']
    paths: ['mobile/**', '.github/workflows/mobile-ios.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Verify Arabic branding and authentication callback
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' ios/Runner/Info.plist | grep -x YSMS
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' ios/Runner/Info.plist | grep -x ysms
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.sai.ysms;' ios/Runner.xcodeproj/project.pbxproj
      - name: Compile unsigned iOS simulator app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          flutter build ios --simulator --no-codesign \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" 2>&1 | tee ../ios-build.log
          test -d build/ios/iphonesimulator/Runner.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ysms-ios-build-log-${{ github.run_number }}
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 14
