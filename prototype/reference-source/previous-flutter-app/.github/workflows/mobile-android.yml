name: Mobile Android verification

on:
  push:
    branches: ['**']
    paths: ['mobile/**', '.github/workflows/mobile-android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" 2>&1 | tee ../android-debug.log
      - name: Compile unsigned release AAB
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" 2>&1 | tee ../android-aab.log
      - name: Verify artifacts and checksums
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/bundle/release/app-release.aab | tee ../SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ysms-android-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
            SHA256SUMS-android.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ysms-android-logs-${{ github.run_number }}
          path: ['android-debug.log', 'android-aab.log']
          if-no-files-found: ignore
          retention-days: 14
