name: Mobile CI

# Runs static analysis and the unit/widget test suite for the Flutter app.
#
# `--fatal-infos` is deliberate: Flutter reports deprecations as "info" level
# diagnostics, so without it a newly deprecated API would never fail the build.
# Pin the last verified stable release until the app can migrate the Material
# APIs deprecated by Flutter 3.50.

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Toolchain version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (deprecations are fatal)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Unit and widget tests
        run: flutter test --reporter expanded