name: SAI V2 Web Checks
on:
  push:
    paths:
      - 'src/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/main-integration.test.mjs'
      - '.mcp.json'
      - '.codex/config.toml'
      - '.vscode/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/main-integration.test.mjs'
      - '.mcp.json'
      - '.codex/config.toml'
      - '.vscode/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main-web:
    name: Portal / production SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/main-integration.test.mjs
      - run: npm run type-check
      - run: npm run build
        env:
          VITE_PUBLIC_SUPABASE_URL: https://aeryusbrulqdxjdynwfh.supabase.co
          VITE_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_test_key
          VITE_SAI_TARGET: production
          IS_PREVIEW: ''
  secondary-web:
    name: web/ compatibility and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # The root app is built in main-web; web/ remains compatibility tests only.
